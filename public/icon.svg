<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with subtle dark gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Stylized Pi Symbol with Gold-Orange-Red gradient and warm glow -->
  <g transform="translate(116, 106)" filter="url(#glow)">
    <path d="M 40,50 
             C 40,50 120,40 240,40 
             C 240,40 240,10 240,10
             L 240,10
             C 240,10 255,5 260,15
             C 265,25 255,40 250,40
             C 250,40 255,40 260,50
             L 270,90
             C 270,90 278,130 280,180
             C 282,230 280,260 270,270
             C 260,280 235,280 230,260
             C 225,240 235,200 235,200
             L 220,100
             L 100,100
             L 100,200
             C 100,200 98,240 90,260
             C 82,280 60,285 45,270
             C 30,255 35,230 40,210
             L 60,100
             L 30,100
             C 30,100 15,100 15,75
             C 15,50 40,50 40,50 Z" 
          fill="url(#piGrad)" />
  </g>
</svg>
